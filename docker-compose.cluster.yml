# Two QueryFlow backends behind nginx, sharing one PostgreSQL and the 3-node Redis ring.
#
#   (cd backend && ./mvnw -DskipTests package)
#   docker compose -f docker-compose.cluster.yml up -d --build
#   curl -i http://localhost:8080/suggest?q=ja      # through nginx
#   curl http://localhost:8081/metrics              # backend-1 directly
#   curl http://localhost:8082/metrics              # backend-2 directly
#
# scripts/run-cluster-bench.sh does all of this and runs the benchmark.
# Ports 8081/8082 are published only so the benchmark can read per-instance metrics;
# in production only nginx would be reachable (the backends trust X-Forwarded-For).

x-backend: &backend
  build: ./backend
  image: queryflow-backend:local
  restart: unless-stopped
  environment: &backend-env
    DB_URL: jdbc:postgresql://postgres:5432/queryflow
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    REDIS_NODE1_HOST: redis-node-1
    REDIS_NODE1_PORT: "6379"
    REDIS_NODE2_HOST: redis-node-2
    REDIS_NODE2_PORT: "6379"
    REDIS_NODE3_HOST: redis-node-3
    REDIS_NODE3_PORT: "6379"
    JPA_SHOW_SQL: "false"
    RATE_LIMIT_TRUST_FORWARDED: "true"
    RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    BATCH_FLUSH_INTERVAL: ${BATCH_FLUSH_INTERVAL:-30}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queryflow
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d queryflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-node-1:
    image: redis:7-alpine
  redis-node-2:
    image: redis:7-alpine
  redis-node-3:
    image: redis:7-alpine

  backend-1:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-1
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis-node-1: { condition: service_started }
      redis-node-2: { condition: service_started }
      redis-node-3: { condition: service_started }

  # Starts after backend-1 is healthy: Hibernate's ddl-auto=update and the CSV
  # dataset load are not designed to run concurrently from two fresh instances.
  backend-2:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-2
    ports: ["8082:8080"]
    depends_on:
      backend-1: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on:
      backend-1: { condition: service_healthy }
      backend-2: { condition: service_healthy }

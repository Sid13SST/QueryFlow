# Free, minimal load balancer in front of the QueryFlow backends.
# Round robin (nginx default): consecutive requests alternate between instances,
# which is what the cluster benchmark checks via the X-QueryFlow-Instance header.

upstream queryflow_backends {
    server backend-1:8080 max_fails=2 fail_timeout=5s;
    server backend-2:8080 max_fails=2 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;

    location / {
        proxy_pass http://queryflow_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Backends trust the RIGHT-MOST X-Forwarded-For entry (the address nginx saw)
        # for per-client rate limiting; $proxy_add_x_forwarded_for appends it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # If one backend dies mid-request, retry idempotent requests on the other.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}

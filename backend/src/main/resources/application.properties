spring.application.name=queryflow-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/queryflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

# QueryFlow Dataset Config
queryflow.dataset.load-on-startup=${LOAD_ON_STARTUP:true}
queryflow.dataset.path=${DATASET_PATH:data/search_queries.csv}

# Distributed Redis Nodes Config
redis.nodes.node1.host=${REDIS_NODE1_HOST:localhost}
redis.nodes.node1.port=${REDIS_NODE1_PORT:6379}
redis.nodes.node2.host=${REDIS_NODE2_HOST:localhost}
redis.nodes.node2.port=${REDIS_NODE2_PORT:6380}
redis.nodes.node3.host=${REDIS_NODE3_HOST:localhost}
redis.nodes.node3.port=${REDIS_NODE3_PORT:6381}

# QueryFlow Trending Searches Config
queryflow.trending.limit=${TRENDING_LIMIT:10}
queryflow.trending.cache.ttl-minutes=${TRENDING_TTL_MINUTES:5}
queryflow.trending.popularity-weight=${TRENDING_POPULARITY_WEIGHT:0.7}
queryflow.trending.recency-weight=${TRENDING_RECENCY_WEIGHT:0.3}
queryflow.trending.candidate-limit=${TRENDING_CANDIDATE_LIMIT:500}

# QueryFlow Batch Write Config
queryflow.batch.flush-interval-seconds=${BATCH_FLUSH_INTERVAL:30}

# QueryFlow Rate Limiting (per client IP, per endpoint group, token bucket)
# capacity = burst size, refill-per-second = sustained rate. Exceeding returns HTTP 429 + Retry-After.
queryflow.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
queryflow.rate-limit.trust-forwarded-header=${RATE_LIMIT_TRUST_FORWARDED:false}
queryflow.rate-limit.forwarded-header=X-Forwarded-For
queryflow.rate-limit.idle-bucket-ttl-seconds=300
queryflow.rate-limit.max-tracked-buckets=100000
queryflow.rate-limit.endpoints.suggest.paths=/suggest
queryflow.rate-limit.endpoints.suggest.capacity=${RATE_LIMIT_SUGGEST_CAPACITY:30}
queryflow.rate-limit.endpoints.suggest.refill-per-second=${RATE_LIMIT_SUGGEST_RPS:10}
queryflow.rate-limit.endpoints.search.paths=/search
queryflow.rate-limit.endpoints.search.capacity=${RATE_LIMIT_SEARCH_CAPACITY:10}
queryflow.rate-limit.endpoints.search.refill-per-second=${RATE_LIMIT_SEARCH_RPS:2}
queryflow.rate-limit.endpoints.trending.paths=/trending,/trending/**
queryflow.rate-limit.endpoints.trending.capacity=${RATE_LIMIT_TRENDING_CAPACITY:20}
queryflow.rate-limit.endpoints.trending.refill-per-second=${RATE_LIMIT_TRENDING_RPS:5}

# Redis resilience: per-node circuit breaker + PostgreSQL fallback
queryflow.cache.redis.command-timeout-ms=${REDIS_COMMAND_TIMEOUT_MS:500}
queryflow.cache.redis.connect-timeout-ms=${REDIS_CONNECT_TIMEOUT_MS:500}
queryflow.cache.circuit-breaker.failure-threshold=${CACHE_CB_FAILURE_THRESHOLD:3}
queryflow.cache.circuit-breaker.open-duration-ms=${CACHE_CB_OPEN_MS:5000}
queryflow.cache.circuit-breaker.probe-interval-ms=${CACHE_CB_PROBE_MS:2000}
queryflow.cache.circuit-breaker.max-pending-invalidations=10000
